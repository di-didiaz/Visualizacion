# Referencia de https://github.com/jrieke/advanced-theming-examples/blob/main/anthropic-dark/.streamlit/config.toml
[theme]
base= "light"
primaryColor = "#000078"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#D0D0D0"
textColor = "#000078"
linkColor = "#0f5df8bb"
borderColor = "#D0D0D0"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "Styrene B"
codeFont = "Fira Code:https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap"
codeBackgroundColor = "#232322"
showSidebarBorder = true
headingFontSizes = ["40px", "32px", "24px"]
headingFontWeights = 400

[theme.sidebar]
backgroundColor = "#73EDFF"
secondaryBackgroundColor = "#000078"
textColor= "#f8f8ff"


[[theme.fontFaces]]
url = "app/static/Styrene_B_Family/StyreneB-Thin-Trial.otf"
family = "Styrene B"
weight = 100

[[theme.fontFaces]]
url = "app/static/Styrene_B_Family/StyreneB-Light-Trial.otf"
family = "Styrene B"
weight = 300

[[theme.fontFaces]]
url = "app/static/Styrene_B_Family/StyreneB-Regular-Trial.otf"
family = "Styrene B"
weight = 400

[[theme.fontFaces]]
